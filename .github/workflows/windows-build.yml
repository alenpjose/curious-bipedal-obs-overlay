name: Windows x64 build

on:
  push:
    branches: [main, 'agent/**']
    tags: ['*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build against OBS Studio 32.1.2
        shell: pwsh
        env:
          CI: 'true'
        run: ./.github/scripts/Build-Windows.ps1 -Target x64 -Configuration Release

      - name: Create portable ZIP
        shell: pwsh
        env:
          CI: 'true'
        run: ./.github/scripts/Package-Windows.ps1 -Target x64 -Configuration Release

      - name: Create Windows installer
        shell: pwsh
        run: |
          $version = (Get-Content buildspec.json -Raw | ConvertFrom-Json).version
          $isccCommand = Get-Command iscc.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $isccPath = if ($isccCommand) { $isccCommand.Path } else { $null }
          if (-not $isccPath) {
            $isccPath = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path -LiteralPath $isccPath -PathType Leaf)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path -LiteralPath $isccPath -PathType Leaf)) {
            throw "Inno Setup compiler not found at $isccPath"
          }
          & $isccPath "/DMyAppVersion=$version" 'installer\curious-bipedal-obs-overlay.iss'

      - name: Smoke-test installer and uninstaller
        id: installer_smoke
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/installer/*.exe | Select-Object -First 1
          if (-not $installer) {
            throw 'Installer executable was not created'
          }

          $testRoot = Join-Path $env:RUNNER_TEMP "curious-bipedal-installer-$([guid]::NewGuid().ToString('N'))"
          $installDir = Join-Path $testRoot 'plugin'
          $installLog = Join-Path $testRoot 'install.log'
          $uninstallLog = Join-Path $testRoot 'uninstall.log'
          New-Item -ItemType Directory -Path $testRoot | Out-Null
          "INSTALLER_TEST_ROOT=$testRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $installArgs = @(
            '/CURRENTUSER'
            '/VERYSILENT'
            '/SUPPRESSMSGBOXES'
            '/NORESTART'
            "/DIR=$installDir"
            "/LOG=$installLog"
          )
          $install = Start-Process -FilePath $installer.FullName -ArgumentList $installArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Get-Content -LiteralPath $installLog -ErrorAction SilentlyContinue
            throw "Installer exited with code $($install.ExitCode)"
          }

          $packageRoot = Resolve-Path 'release/Release/curious-bipedal-obs-overlay'
          $packageFiles = Get-ChildItem -LiteralPath $packageRoot -Recurse -File
          $hashRows = @()
          foreach ($packageFile in $packageFiles) {
            $relativePath = [IO.Path]::GetRelativePath($packageRoot, $packageFile.FullName)
            $installedFile = Join-Path $installDir $relativePath
            if (-not (Test-Path -LiteralPath $installedFile -PathType Leaf)) {
              throw "Installer omitted $relativePath"
            }
            if ((Get-FileHash -LiteralPath $installedFile -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $packageFile.FullName -Algorithm SHA256).Hash) {
              throw "Installed file differs from package: $relativePath"
            }
            $hashRows += [ordered]@{
              path = $relativePath
              package_sha256 = (Get-FileHash -LiteralPath $packageFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              installed_sha256 = (Get-FileHash -LiteralPath $installedFile -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $hashRows | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $testRoot 'installed-file-hashes.json') -Encoding utf8

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw 'Installer did not create an uninstaller'
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            '/VERYSILENT'
            '/SUPPRESSMSGBOXES'
            '/NORESTART'
            "/LOG=$uninstallLog"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            Get-Content -LiteralPath $uninstallLog -ErrorAction SilentlyContinue
            throw "Uninstaller exited with code $($uninstall.ExitCode)"
          }

          foreach ($packageFile in $packageFiles) {
            $relativePath = [IO.Path]::GetRelativePath($packageRoot, $packageFile.FullName)
            if (Test-Path -LiteralPath (Join-Path $installDir $relativePath)) {
              throw "Uninstaller left runtime file behind: $relativePath"
            }
          }
          [ordered]@{
            installer_exit = $install.ExitCode
            uninstaller_exit = $uninstall.ExitCode
            files_verified = $packageFiles.Count
            runtime_leftovers = 0
            passed = $true
          } | ConvertTo-Json | Set-Content (Join-Path $testRoot 'lifecycle-summary.json') -Encoding utf8

      - name: Preserve installer lifecycle evidence
        if: always()
        shell: pwsh
        env:
          SMOKE_OUTCOME: ${{ steps.installer_smoke.outcome }}
        run: |
          $evidenceDir = 'release/evidence/installer-lifecycle'
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          if ($env:INSTALLER_TEST_ROOT -and (Test-Path -LiteralPath $env:INSTALLER_TEST_ROOT)) {
            Get-ChildItem -LiteralPath $env:INSTALLER_TEST_ROOT -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in '.log', '.json' } |
              Copy-Item -Destination $evidenceDir
          }
          [ordered]@{
            workflow_outcome = $env:SMOKE_OUTCOME
            commit = (git rev-parse HEAD)
            event_sha = $env:GITHUB_SHA
            runner = $env:RUNNER_OS
          } | ConvertTo-Json | Set-Content (Join-Path $evidenceDir 'workflow-summary.json') -Encoding utf8

      - name: Upload installer lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: curious-bipedal-installer-lifecycle-evidence
          if-no-files-found: error
          path: release/evidence/installer-lifecycle/

      - name: Verify Windows packages
        shell: pwsh
        run: ./.github/scripts/Test-Package-Windows.ps1 -Configuration Release

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          Get-FileHash release/*.zip, release/installer/*.exe, release/Release/curious-bipedal-obs-overlay/bin/64bit/curious-bipedal-obs-overlay.dll -Algorithm SHA256 |
            ForEach-Object { '{0} *{1}' -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } |
            Set-Content release/SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: curious-bipedal-obs-overlay-windows-x64
          if-no-files-found: error
          path: |
            release/*.zip
            release/installer/*.exe
            release/Release/curious-bipedal-obs-overlay/bin/64bit/curious-bipedal-obs-overlay.dll
            release/SHA256SUMS.txt

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${env:GITHUB_REF_NAME}" release/*.zip release/installer/*.exe release/SHA256SUMS.txt --generate-notes
